<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard de lançamento e análise de dados de Gente e Gestão (RH).">
  <meta name="robots" content="noindex">
  <title>Gente &amp; Gestão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="./favicon.png">
  <script>
    document.documentElement.classList.toggle("dark", localStorage.getItem("gg-theme") === "dark");
  </script>
  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      font-family: Inter, system-ui, sans-serif;
    }
    .dark #app-loading {
      background: rgba(9, 9, 11, 0.92);
    }
    #app-loading p {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #3f3f46;
      text-align: center;
    }
    .dark #app-loading p {
      color: #e4e4e7;
    }
    #app-loading .gg-spinner {
      position: relative;
      height: 58px;
      width: 58px;
    }
    #app-loading .gg-spinner-track {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 3px solid #e4e4e7;
    }
    .dark #app-loading .gg-spinner-track {
      border-color: #3f3f46;
    }
    #app-loading .gg-spinner-arc {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      border: 3px solid transparent;
      border-top-color: #E8AF3E;
      border-right-color: #E8AF3E;
      animation: gg-spin 0.85s cubic-bezier(0.5, 0.05, 0.5, 0.95) infinite;
    }
    @keyframes gg-spin {
      to { transform: rotate(360deg); }
    }
    #app-loading .gg-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    #app-loading .gg-progress {
      height: 3px;
      width: 168px;
      overflow: hidden;
      border-radius: 9999px;
      background: #e4e4e7;
    }
    .dark #app-loading .gg-progress {
      background: #3f3f46;
    }
    #app-loading .gg-progress-fill {
      display: block;
      height: 100%;
      width: 35%;
      border-radius: 9999px;
      background: linear-gradient(90deg, transparent, #E8AF3E, transparent);
      animation: gg-progress-sweep 1.4s ease-in-out infinite;
    }
    @keyframes gg-progress-sweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(380%); }
    }
  </style>
  <script type="module" crossorigin src="./assets/app-DKUSlYB_.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/vue-BkZ5EyOV.js">
  <link rel="modulepreload" crossorigin href="./assets/vue-router-CLV7QTPG.js">
  <link rel="stylesheet" crossorigin href="./assets/app-VIHkgDnh.css">
</head>
<body>
  <div id="app"></div>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="gg-spinner">
      <span class="gg-spinner-track"></span>
      <span class="gg-spinner-arc"></span>
    </div>
    <div class="gg-col">
      <p>Carregando informações...</p>
      <div class="gg-progress"><span class="gg-progress-fill"></span></div>
    </div>
  </div>
</body>
</html>
