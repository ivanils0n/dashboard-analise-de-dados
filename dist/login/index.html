<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="gg-page" content="login">
  <meta name="description" content="Acesso ao Dashboard de Gente e Gestão (RH).">
  <title>Gente &amp; Gestão — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("gg-theme") === "dark" ? "dark" : "light");
  </script>
  <script type="module" crossorigin src="../assets/env.build-BaW8n9p1.js"></script>
</head>
<body class="login-body">

  <main class="login-wrap">
    <div class="login-card">
      <img src="../logo.png" alt="Gente & Gestão" class="login-logo">
      <p class="login-sub">Entre para acessar o dashboard</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginUser">Usuário</label>
          <input type="text" id="loginUser" class="input" placeholder="Usuário" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" class="input" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <p class="login-error" id="loginError" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">
          <span id="loginSubmitText">Entrar</span>
        </button>
      </form>
    </div>

    <footer class="login-footer">Gente &amp; Gestão · Dashboard de análise de dados RH</footer>
  </main>

  <script src="../libs/supabase.min.js"></script>
  <script src="../js/env.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
