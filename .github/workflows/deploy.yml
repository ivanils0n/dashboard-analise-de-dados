name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Instala as dependências (Vite) — usa pnpm se houver lockfile, senão npm
      - name: Instalar dependências
        run: |
          if [ -f pnpm-lock.yaml ]; then
            npm i -g pnpm@latest && pnpm install --no-frozen-lockfile
          else
            npm install
          fi

      # O Vite injeta as credenciais no bundle durante o build.
      # Cadastre em Settings → Secrets and variables → Actions:
      #   SUPABASE_URL       (secret ou variable)
      #   SUPABASE_ANON_KEY  (secret ou variable)
      - name: Build com credenciais injetadas
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm exec vite build; else npx vite build; fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Publicar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
