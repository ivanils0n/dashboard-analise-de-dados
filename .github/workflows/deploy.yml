name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Instala as dependências (Vite) — usa pnpm se houver lockfile, senão npm
      - name: Instalar dependências
        run: |
          if [ -f pnpm-lock.yaml ]; then
            npm i -g pnpm@latest && pnpm install --no-frozen-lockfile
          else
            npm install
          fi

      # O front fala com o Worker (backend/) que acessa o CockroachDB.
      # Informe a URL pública do Worker para o build:
      #   Settings → Secrets and variables → Actions → VITE_API_BASE
      # Ex.: https://gente-gestao-api.SEU-SUBDOMINIO.workers.dev
      - name: Build com a URL da API injetada
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm exec vite build; else npx vite build; fi
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || vars.VITE_API_BASE }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Publicar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
